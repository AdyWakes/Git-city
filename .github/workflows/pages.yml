name: Demo site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      regenerate:
        description: Re-clone the demo repositories and regenerate their cities
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Regenerate demo cities
        if: ${{ inputs.regenerate }}
        run: node scripts/build-demo-data.mjs --cache /tmp/gitcity-cache
      - run: node scripts/build-demo-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
